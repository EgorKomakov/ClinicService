{% extends 'base.html' %}
{% block content %}
<div class="error-page fade-in">
    <div class="error-code" style="background: linear-gradient(135deg, #e53e3e, #c53030); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">500</div>
    <h3>Внутренняя ошибка сервера</h3>
    <p class="text-muted">Упс! Что-то пошло не так на нашей стороне. <br>Мы уже получили сигнал об ошибке и работаем над её исправлением.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg mt-3">
        <i class="bi bi-house"></i> Вернуться на главную
    </a>
</div>
{% endblock %}
