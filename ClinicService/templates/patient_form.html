{% extends 'base.html' %}
{% block content %}
<h1>{{ 'Редактировать' if patient else 'Новый пациент' }}</h1>
<div class="card p-4 mt-3">
    <form method="post" novalidate>
        <div class="mb-3">
            <label class="form-label">Имя *</label>
            <input name="first_name" class="form-control" required
                   pattern="[A-Za-zА-Яа-яЁё\-]{1,50}"
                   title="Только буквы и дефис, до 50 символов"
                   value="{{ patient.first_name if patient else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Фамилия *</label>
            <input name="last_name" class="form-control" required
                   pattern="[A-Za-zА-Яа-яЁё\-]{1,50}"
                   title="Только буквы и дефис, до 50 символов"
                   value="{{ patient.last_name if patient else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Дата рождения *</label>
            <input name="dob" type="date" class="form-control" required
                   max="{{ today }}"
                   value="{{ patient.birth_date.strftime('%Y-%m-%d') if patient and patient.birth_date else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Телефон *</label>
            <input name="phone" class="form-control" required
                   id="patientPhone"
                   placeholder="+7 999 123 45 67"
                   value="{{ patient.phone if patient else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Email *</label>
            <input name="email" type="email" class="form-control" required
                   value="{{ patient.email if patient else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Примечания</label>
            <textarea name="notes" class="form-control">{{ patient.notes if patient else '' }}</textarea>
        </div>
        <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Сохранить</button>
        <a class="btn btn-secondary" href="{{ url_for('patients_list') }}">Отмена</a>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const phoneInput = document.getElementById('patientPhone');
    if (phoneInput) {
        phoneInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^\d\s+\-()]/g, '');
        });
    }
});
</script>
{% endblock %}
