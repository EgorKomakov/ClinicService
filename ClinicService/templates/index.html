{% extends 'base.html' %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-4 fw-bold" style="color: #1e5f5f;">Добро пожаловать в Поликлинику</h1>
    <p class="lead text-muted">Современная система управления приёмами, пациентами и врачами</p>
    <img src="{{ url_for('static', filename='clinic.jpg') }}" alt="Поликлиника"
         class="img-fluid rounded-4 shadow-lg mt-4 w-75 w-md-50">
    {% if not current_user.is_authenticated %}
        <div class="mt-4">
            <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg px-4">Войти в систему</a>
        </div>
    {% endif %}
</div>
{% endblock %}
