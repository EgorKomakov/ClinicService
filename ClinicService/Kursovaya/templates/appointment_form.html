{% extends "base.html" %}

{% block content %}
<h2>{% if appointment %}Редактирование{% else %}Новый приём{% endif %}</h2>
<div class="card p-4 mt-3">
    <form method="POST">
        {% if for_patient %}
            <div class="mb-3">
                <label class="form-label">Врач</label>
                <input class="form-control" value="{{ doctor.full_name() }} ({{ doctor.specialization or '—' }})" disabled>
                <input type="hidden" name="doctor_id" value="{{ doctor.id }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Дата и время приёма</label>
                <select name="slot_datetime" class="form-select" required>
                    <option value="">-- Выберите свободное время --</option>
                    {% for dt in available_slots %}
                        <option value="{{ dt.strftime('%Y-%m-%dT%H:%M') }}">
                            {{ dt.strftime('%d.%m.%Y') }} ({{ ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'][dt.weekday()] }}) {{ dt.strftime('%H:%M') }}
                        </option>
                    {% endfor %}
                </select>
                {% if not available_slots %}
                    <div class="form-text text-danger">Нет доступных слотов для записи.</div>
                {% endif %}
            </div>
        {% else %}
            <div class="mb-3">
                <label class="form-label">Пациент:</label>
                <select name="patient_id" class="form-select" required>
                    <option value="">-- Выберите пациента --</option>
                    {% for patient in patients %}
                        <option value="{{ patient.id }}"
                            {% if appointment and appointment.patient_id == patient.id %}selected{% endif %}>
                            {{ patient.full_name() }} ({{ patient.email }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Врач:</label>
                <select name="doctor_id" class="form-select" required>
                    <option value="">-- Выберите врача --</option>
                    {% for doctor in doctors %}
                        <option value="{{ doctor.id }}"
                            {% if appointment and appointment.doctor_id == doctor.id %}selected{% endif %}>
                            {{ doctor.full_name() }} ({{ doctor.specialization or '—' }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Дата и время:</label>
                <input type="datetime-local" name="date" class="form-control"
                       value="{{ appointment.date.strftime('%Y-%m-%dT%H:%M') if appointment else '' }}" required>
            </div>
        {% endif %}

        <div class="mb-3">
            <label class="form-label">Примечания</label>
            <textarea name="notes" class="form-control">{{ appointment.notes if appointment else '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Сохранить</button>
    </form>
</div>
{% endblock %}
